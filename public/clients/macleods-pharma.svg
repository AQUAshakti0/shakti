<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <rect width="320" height="100" fill="#ffffff" rx="8"/>
  <g transform="translate(20, 15)">
    <!-- Red MACLEODS Text -->
    <text x="140" y="32" text-anchor="middle" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#b91c1c" letter-spacing="1">MACLEODS</text>

    <!-- Vertical Lines Strip -->
    <g fill="#1e293b" transform="translate(30, 36)">
      <rect x="0" y="0" width="220" height="10" rx="1"/>
      <line x1="0" y1="5" x2="220" y2="5" stroke="#ffffff" stroke-width="2" stroke-dasharray="3,3"/>
    </g>

    <!-- Text Macleods Pharmaceuticals Limited -->
    <text x="140" y="62" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#0f172a">Macleods Pharmaceuticals</text>
    <text x="140" y="76" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#0f172a">Limited</text>
  </g>
</svg>
