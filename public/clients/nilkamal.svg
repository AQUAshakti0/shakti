<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110">
  <rect width="320" height="110" fill="#ffffff" rx="8"/>
  
  <g transform="translate(40, 6)">
    <!-- Top 'n' Icon with White Lotus (Kamal) cutout -->
    <g transform="translate(75, 0)">
      <!-- Outer 'n' block shape in Nilkamal Blue -->
      <path d="M 12 60 L 12 18 C 12 18, 12 0, 45 0 C 78 0, 78 18, 78 18 L 78 60 Z" fill="#009ee3"/>
      
      <!-- Lotus Flower in White inside the 'n' -->
      <!-- Center main petal -->
      <path d="M 45 19 C 39 27, 36 38, 45 48 C 54 38, 51 27, 45 19 Z" fill="#ffffff"/>
      <!-- Inner left petal -->
      <path d="M 41 24 C 33 26, 26 36, 36 48 C 41 42, 42 33, 41 24 Z" fill="#ffffff"/>
      <!-- Inner right petal -->
      <path d="M 49 24 C 57 26, 64 36, 54 48 C 49 42, 48 33, 49 24 Z" fill="#ffffff"/>
      <!-- Outer left sweeping petal -->
      <path d="M 28 35 C 19 36, 13 46, 24 54 C 32 50, 31 43, 28 35 Z" fill="#ffffff"/>
      <!-- Outer right sweeping petal -->
      <path d="M 62 35 C 71 36, 77 46, 66 54 C 58 50, 59 43, 62 35 Z" fill="#ffffff"/>
      <!-- Lotus base curves -->
      <path d="M 16 57 C 28 53, 38 52, 45 52 C 52 52, 62 53, 74 57 C 62 61, 28 61, 16 57 Z" fill="#ffffff"/>
      
      <!-- Registered Trademark ® Symbol -->
      <circle cx="88" cy="8" r="7" fill="none" stroke="#222222" stroke-width="1.2"/>
      <text x="88" y="11.5" text-anchor="middle" font-family="'Arial', sans-serif" font-size="8.5" font-weight="bold" fill="#222222">R</text>
    </g>

    <!-- Nilkamal Brand Text -->
    <text x="120" y="86" text-anchor="middle" font-family="'Trebuchet MS', 'Arial Black', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#009ee3" letter-spacing="-0.5">Nilkamal</text>
    
    <!-- Solid Black Baseline / Underline -->
    <rect x="15" y="93" width="210" height="4.5" fill="#111111" rx="1"/>
  </g>
</svg>
